name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint (includes i18n hardcoded-string gate)
        # Scoped to the two Next.js dashboards (this story's own AC #1 scope)
        # rather than the full `pnpm run lint` -- apps/mobile has no runnable
        # code yet (Epic 2+) and its own `expo lint` toolchain has an
        # unrelated, pre-existing dependency resolution gap, unrelated to
        # and out of scope for this story's i18n gate.
        run: npx turbo run lint --filter=@gymos/dashboard --filter=@gymos/super-admin

      - name: i18n locale key-parity check
        run: pnpm run check:i18n

      - name: Unit/component tests
        # Scoped to dashboard, matching the lint step above -- the only app
        # with a wired-up test runner so far (Story 2.10 QA automation).
        run: npx turbo run test --filter=@gymos/dashboard

  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `supabase start` validates the entire config.toml at boot, including
      # auth.hook.send_sms's secret format (Story 2.1), even though no pgTAP
      # test in this job ever exercises that hook -- a syntactically-valid
      # dummy value (never used against a real webhook, never sent anywhere)
      # satisfies the CLI's own startup validation gate.
      SEND_SMS_HOOK_SECRET: "v1,whsec_Y2ktZHVtbXktbm90LWEtcmVhbC1zZWNyZXQtdmFsdWU="
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
