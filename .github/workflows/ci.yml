name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint (includes i18n hardcoded-string gate)
        # Scoped to the two Next.js dashboards (this story's own AC #1 scope)
        # rather than the full `pnpm run lint` -- apps/mobile has no runnable
        # code yet (Epic 2+) and its own `expo lint` toolchain has an
        # unrelated, pre-existing dependency resolution gap, unrelated to
        # and out of scope for this story's i18n gate.
        run: npx turbo run lint --filter=@gymos/dashboard --filter=@gymos/super-admin

      - name: i18n locale key-parity check
        run: pnpm run check:i18n

      - name: Unit/component tests
        # Scoped to dashboard, matching the lint step above -- the only app
        # with a wired-up test runner so far (Story 2.10 QA automation).
        run: npx turbo run test --filter=@gymos/dashboard

  rls-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `supabase start` validates the entire config.toml at boot, including
      # auth.hook.send_sms's secret format (Story 2.1), even though no pgTAP
      # test in this job ever exercises that hook -- a syntactically-valid
      # dummy value (never used against a real webhook, never sent anywhere)
      # satisfies the CLI's own startup validation gate.
      SEND_SMS_HOOK_SECRET: "v1,whsec_Y2ktZHVtbXktbm90LWEtcmVhbC1zZWNyZXQtdmFsdWU="
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start local Supabase and apply migrations
        # `-x` excludes containers this job never uses. Not an optimization --
        # `edge-runtime` crashed with "Bus error (core dumped)" on a real
        # runner (2026-09-06), which fails `supabase start`'s health check and
        # takes the whole job down with "Error status 503" before a single
        # test runs. pgTAP only ever talks to Postgres, and neither job runs
        # `supabase functions serve`, so the edge runtime was never reachable
        # even when it did boot. studio/imgproxy/inbucket/vector are UI, image
        # transformation, a mail catcher and a log shipper -- all equally
        # unused here, and every extra container is one more thing that can
        # fail a health check on a shared runner.
        run: supabase start -x edge-runtime,functions,studio,imgproxy,inbucket,vector

      - name: Run pgTAP RLS tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  e2e-tests:
    runs-on: ubuntu-latest
    # A full local run (supabase db reset + next build + all 8 specs) timed
    # at ~1 minute end-to-end; 15 minutes matches rls-tests' own budget,
    # generous margin over CI's extra install/Docker-pull/browser-download
    # overhead a local run doesn't pay.
    timeout-minutes: 15
    env:
      SEND_SMS_HOOK_SECRET: "v1,whsec_Y2ktZHVtbXktbm90LWEtcmVhbC1zZWNyZXQtdmFsdWU="
      # Story 13.5: this repo's first E2E investment, additive alongside
      # typecheck/rls-tests (neither existing job is modified). No
      # `supabase functions serve` step here -- the only spec that needs it
      # (Flow 2's payment-webhook replay) self-skips unless real,
      # gym-connectable TaraMoney credentials are supplied via
      # E2E_TARAMONEY_GYM_* secrets (not present by default, including
      # here); see docs/decisions.md's Story 13.5 entry and
      # payment-cutover.spec.ts's own top-of-file comment.
      DASHBOARD_APP_URL: "http://127.0.0.1:3100"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start local Supabase and apply migrations
        # See rls-tests' own note above for why these are excluded. The one
        # spec that posts to an Edge Function (payment-cutover.spec.ts's
        # payment-webhook replay) is `test.skip`-gated on E2E_TARAMONEY_GYM_*
        # secrets that are deliberately absent here, and this job never runs
        # `supabase functions serve`, so excluding the edge runtime removes a
        # container that could only ever crash the job, never serve it.
        run: supabase start -x edge-runtime,functions,studio,imgproxy,inbucket,vector

      - name: Export local Supabase keys as dashboard env vars
        # The same fixed, non-secret local-dev demo keys `supabase start`
        # always prints (deterministic given config.toml's own committed
        # JWT_SECRET) -- mirrors apps/dashboard/.env.local's own values,
        # regenerated here since CI has no .env.local file (gitignored).
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          # Fail loudly here rather than silently exporting empty values if
          # supabase status -o env's variable names ever change between CLI
          # versions -- this job is unverified on a real runner as of this
          # story (see docs/decisions.md), so this is the first real chance
          # to catch a naming mismatch instead of a confusing downstream
          # dashboard-boot failure.
          : "${API_URL:?supabase status -o env did not export API_URL}"
          : "${PUBLISHABLE_KEY:?supabase status -o env did not export PUBLISHABLE_KEY}"
          : "${SERVICE_ROLE_KEY:?supabase status -o env did not export SERVICE_ROLE_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/dashboard

      - name: Run E2E suite
        run: npx turbo run test:e2e --filter=@gymos/dashboard

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
          retention-days: 14

      - name: Stop local Supabase
        if: always()
        run: supabase stop
