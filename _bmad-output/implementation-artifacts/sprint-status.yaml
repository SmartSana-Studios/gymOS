last_updated: 2026-09-02 (bmad-code-review: 4-16 status review -> done -- 3 parallel adversarial layers (Blind Hunter, Edge Case Hunter, Acceptance Auditor) against the uncommitted diff vs. baseline b8e6755 + story spec. Acceptance Auditor found zero AC violations, independently re-verifying the guard's placement/scoping/no-op behavior against the actual shipped SQL. 1 decision-needed: the platform-collision rejection message names the platform account by design (vs. a generic "already connected" message for gym-vs-gym collisions), a low-severity ID-guessing oracle given business_id_plain is documented non-secret elsewhere -- user chose to keep the distinct message as spec'd, no code change. 6 patches applied: guard now scoped to provider_key = 'taramoney' only (previously would have wrongly rejected a future second provider's legitimate business_id sharing the platform's TaraMoney ID by coincidence -- manually verified against the local DB); Vault secret lookup gained order by created_at desc limit 1 (defensive, first name-keyed Vault lookup in this codebase); the Vault secret value is now btrim'd before comparison (previously only the submitted business_id was trimmed, so stray whitespace in the seeded secret could have silently defeated the guard); deploy-runbook.md's now-stale "per-gym Tara Money credentials not yet built" sentence (falsified by Stories 4.13-4.15) corrected next to the new bullet it sat beside; pgTAP gained a before/after audit_log count-delta assertion directly proving AC #1's "no audit-log row" requirement (previously only structurally true); pgTAP gained a fresh-connect (INSERT-branch) rejection case reusing gym A, previously only the reconnect/UPDATE branch was tested. 4 findings deferred to deferred-work.md (no audit of pre-existing gym_payment_credentials rows from before this guard existed; decrypted_secret NULL-on-decryption-failure indistinguishable from unseeded, a systemic Vault-read characteristic shared by other functions; a negligible TOCTOU race requiring already-privileged Vault access; no automated drift check between the two independently-seeded business-ID values, already disclosed in the runbook's own prose). 5 dismissed as noise (case-sensitivity concern -- consistent with existing case-sensitive convention and real mixed-case IDs; no dedicated errors.ts unit test -- pre-existing convention, zero such tests exist for any mapping in that file; no audit-log entry for a rejected attempt -- re-litigates AC #1's already-decided requirement; no CI/deploy-time enforcement that the Vault secret is seeded -- an explicitly disclosed, deliberate no-op-if-unseeded design choice; i18n copy tone asymmetry -- cosmetic, folded into the decision item). Full pgTAP suite (gym_payment_credentials_rls.test.sql, plan 41 -> 44) re-run clean post-patch, verified directly against the local Supabase Postgres container after re-applying the patched migration 0083)
