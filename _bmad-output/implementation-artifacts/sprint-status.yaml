ts yet for coaches.ts specifically, matching the story's own Dev Notes), pgTAP unchanged 1371/1371 across 64 files (zero new migration/RLS/pgTAP per this story's own Scope Boundary, confirmed identical count before/after via a supabase db reset baseline), production dashboard build clean including the modified /coach/[memberId] route; manual browser verification not performed this session (no browser automation available), precise steps recorded in the story file's own Completion Notes, same disclosure discipline as every prior Epic 9/10 story)
