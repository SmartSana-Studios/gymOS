packages:
  - "apps/*"
  - "packages/*"

# eslint-config-next's dist/parser.js does `require('next/dist/compiled/babel/eslint-parser')`
# without declaring `next` as its own dependency -- works under npm/yarn's
# flat node_modules (hoisting papers over it) but fails to resolve under
# pnpm's isolated layout. A scoped packageExtension (rather than a global
# public-hoist-pattern, which risks affecting unrelated packages' own
# dependency resolution, e.g. apps/mobile) declares this dependency only
# for eslint-config-next itself. Story 1.10 -- first story to actually run
# `pnpm lint`, which surfaced this pre-existing gap.
packageExtensions:
  eslint-config-next:
    dependencies:
      next: "*"
  # @sentry/react-native's Expo config plugin (plugin/build/withSentry*.js)
  # does `require('@expo/config-plugins')` without declaring it as its own
  # dependency -- the same undeclared-dependency shape as eslint-config-next
  # above, and it fails the same way under pnpm's isolated layout: any
  # `expo config` / `expo prebuild` / `expo-doctor` run dies with
  # "PluginError: Cannot find module '@expo/config-plugins'" the moment it
  # tries to evaluate the plugin. Surfaced by the 2026-09-06 SDK 57
  # dependency alignment, which moved Sentry from 8.24.0 (a major version
  # ahead of what SDK 57 supports, and which vendored its own copy) down to
  # the SDK-expected 7.11.0, which does not.
  "@sentry/react-native":
    dependencies:
      "@expo/config-plugins": "*"
