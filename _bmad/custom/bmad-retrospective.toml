# Team customization (committed). Lists append to the skill defaults.
# Source: Epic 22 retrospective, docs: _bmad-output/implementation-artifacts/epic-22-retro-2026-10-19.md

[workflow]
persistent_facts = [
  "DEFERRALS THAT NAME A LATER STORY ARE ACCEPTANCE CRITERIA (Epic 22 retro 67): a deferral worded 'close before X' or 'before the flag is on' belongs in story X's acceptance criteria, not in deferred-work.md. Before closing a story, search deferred-work.md for lines that name it and move them into its criteria.",
  "A GATE MUST BE SHOWN CAPABLE OF FAILING (Epic 22 retro 77): when a gate script (scripts/ci-local.sh, a pgTAP runner, a CI job) is changed or reused, run it once against a known-bad input and say so. Read the per-stage lines, not only the final GREEN: on 2026-10-17 ci-local reported pgtap PASS with FAIL lines in its log because `set -e` is ignored inside an `if`. scripts/ci-local.selftest.sh now guards that; run it when you touch ci-local.sh.",
  "DEPLOY TOOLING IS TESTED BEFORE THE WINDOW (Epic 22 retro 78): before any production deploy run `bash scripts/deploy-readiness.sh <next migration version>` (read-only: management API token, ledger head, gh login, last green db-backup, pg module, and whether prod_psql silently returns nothing here). Production migrations go through scripts/deploy-migration.sh or scripts/deploy-0124-0130.sh, which refuse without a fresh GREEN db-backup run (docs/decisions.md, V1.6 release runbook, section 3). Never apply by another path without the same backup.",
  "READ THE PROJECT'S OWN RECORDS BEFORE CLAIMING A SAFEGUARD IS MISSING (Epic 22 retro N4): production is on the Supabase free plan, so Supabase backups and PITR are empty by design; the real backup is the nightly encrypted db-backup workflow to Cloudflare R2 (docs/decisions.md section 3). Check docs/decisions.md, docs/deploy-runbook.md and .github/workflows before telling the owner something does not exist. Never buy a paid add-on without an explicit yes.",
]
